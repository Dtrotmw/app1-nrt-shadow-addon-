name: "APP1 NRT Shadow Retrieval"
version: "0.2.2"
slug: "app1_nrt_shadow"
description: >-
  Shadow trial of the new GNSS-IR retrieval pipeline (North sector alone,
  robust anchor -- entry 59, 2026-08-07: properly-settled testing showed
  this clearly beats the earlier wide Chivenor+Instow+North combination),
  post-processed through a K2D replica (Track A). Reads RINEX files from
  the Atom mini PC's Samba share, reads live surge forcing from
  sensor.forcing_surge, and publishes sensor.dji_obs_raw /
  sensor.dji_obs_k2d for comparison alongside the live Simon+K2D system --
  does not touch or modify any existing sensor/automation, only adds new
  ones. Comparison-only, for a multi-week trial before any decision about
  replacing the live system.
url: "https://github.com/Dtrotmw/app1-nrt-shadow-addon-"
arch:
  - amd64
startup: services
boot: auto
init: false
homeassistant_api: true
# config:ro -- READ-ONLY access to /config (i.e. H:\), mapped to /config
# inside the container. Used ONLY to read the live-updating tide
# prediction (H:\www\gnss5mins.csv, confirmed already in the exact
# (datetime,level) headerless format our pipeline expects -- no adaptation
# needed). This is a read path, not a write path -- the standing "ask
# permission before editing H:\" rule is about writes; this add-on never
# writes anything under /config.
# share:rw -- /share is a folder every add-on can see (File editor, Samba
# share add-on, etc.), used ONLY to mirror results.csv out so it's actually
# reachable without container/host shell access. Nothing else is written
# there.
# homeassistant_api: true -- grants a SUPERVISOR_TOKEN usable against Core's
# own REST API (via http://supervisor/core/api), auto-injected, no separate
# credential. Used to (a) read sensor.forcing_surge (V13's live surge output
# -- deliberately not reimplemented here) and (b) publish sensor.dji_obs_raw
# / sensor.dji_obs_k2d as new, additive entities. Never reads or writes any
# other entity, and never touches sensor.gnss15k2d or gnss_live.yaml itself.
map:
  - "addon_config:rw"
  - "config:ro"
  - "share:rw"
options:
  smb_host: "192.168.1.120"
  smb_share: "AtomShare"
  smb_username: "dji"
  smb_password: ""
  pred_file_path: "/config/www/gnss5mins.csv"
schema:
  smb_host: "str"
  smb_share: "str"
  smb_username: "str"
  smb_password: "password"
  pred_file_path: "str"
